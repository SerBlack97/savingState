<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="wrapper">
      <div id="count">0</div>

      <!-- user input -->
      <div class="controls">
        <button id="minusButton" type="button">−1</button>
        <button id="addButton" type="button">+1</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
      <!-- display results -->
    <div class="scores">
        <div><strong>Best:</strong> <span id="best">0</span></div>
        <div><strong>Last update:</strong> <span id="update">Never</span></div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
